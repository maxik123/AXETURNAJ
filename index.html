<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvP Overlay</title>
<link rel="stylesheet" href="css/style.css">
</head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
async function exportOverlay() {
    const overlay = document.querySelector(".scoreboard");

    const canvas = await html2canvas(overlay, {
        backgroundColor: null,
        scale: 2,
        useCORS: true,
        allowTaint: false
    });

    const link = document.createElement("a");

    link.download = "pvp-overlay.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
}
</script>
    <button id="exportButton" onclick="exportOverlay()">
    EXPORT PNG
</button>
    
<body>
<div class="scoreboard">
    <div class="player left">
        <img class="skin" src="https://mc-heads.net/avatar/ksd_argys/58" alt="ksd_argys">
        <div class="name">ksd_argys</div>
    </div>

    <div class="center">
        <img class="center-logo" src="img/logo.png" alt="Logo">
    </div>

    <div class="player right">
        <div class="name">Drticka</div>
        <img class="skin" src="https://mc-heads.net/avatar/Drticka/58" alt="Drtička">
    </div>

    <div class="red-line"></div>
</div>
</body>
</html>
